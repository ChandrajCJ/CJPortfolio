    <script>
      // Apply the stored/OS theme before first paint so there is no flash.
      (function () {
        try {
          var ids = ['grey', 'dark', 'ocean', 'terminal', 'light', 'paper']
          var bars = { grey: '#0B0B0B', dark: '#0A0B0D', ocean: '#090D12', terminal: '#080A08', light: '#ffffff', paper: '#FAF9F6' }
          var stored = localStorage.getItem('cj-theme')
          var theme = ids.indexOf(stored) > -1 ? stored : 'grey'
          if (theme !== 'grey') document.documentElement.classList.add(theme)
          document.documentElement.style.colorScheme = theme === 'light' || theme === 'paper' ? 'light' : 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[theme])
        } catch (e) {
          /* no-op: defaults to greyscale */
        }
      })()
    </script>
