[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # GEMINI_MODEL is a model name, not a credential, and it appears in the repo
  # as the documented default. Netlify's secrets scanner treats every env var as
  # a secret and fails the build when its value is found in source, so this key
  # is exempted. GEMINI_API_KEY is deliberately NOT exempted - it must never
  # appear in the repo.
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fingerprinted build output is immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
